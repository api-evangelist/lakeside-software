  error envelope) are recorded as unknown rather than guessed.
base_url: https://cloud.lakesidesoftware.com/api/
api_style: REST over HTTPS, JSON request and response bodies
deployment_models: [cloud (SaaS tenant), on-premises]
authentication:
  scheme: SysTrack API key (Read, Read/Write, Ingest, SysTrack AI Partner variants)
  user_signin: Azure AD B2C / Microsoft Entra ID, or SAML SSO
  mcp: OAuth 2.0 with Microsoft Entra ID
  detail: authentication/lakeside-software-authentication.yml
idempotency:
  supported: false
  mechanism: null
  note: >-
    No idempotency-key header or replay-safety mechanism is documented on any public SysTrack page.
    The Ingest API instead achieves safety through an explicit staged workflow (upload, diff review,
    then a separate process call) rather than through client-supplied idempotency keys. Recorded as
    unsupported rather than asserted — no Idempotency pointer is wired in apis.yml.
staged_write_workflow:
  applies_to: Ingest API
  description: >-
    The Ingest API deliberately splits a write into discrete, reviewable steps so that schema or data
    drift is surfaced before anything is committed.
  steps:
  - Define the target schema for users or devices (JSON) and send it to SysTrack.
  - Send a CSV file matching the defined schema.
  - SysTrack analyzes the upload and reports differences between the CSV and the current schema.
  - Review the differences and decide how to proceed.
  - Explicitly call the process endpoint to start ingestion.
  - SysTrack ingests the data and exposes it via RPT_EnrichedDevices and RPT_EnrichedUsers.
  - Ingested devices are associated with their WGUID, optimized to run during off-hours.
  docs: https://documentation.lakesidesoftware.com/docs/ingest-api-user-guide
