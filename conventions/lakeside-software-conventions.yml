data_constraints:
  ingest:
  - Only CSV files are supported.
  - Up to 2,000 bytes of metadata per row.
  - A CSV file can contain rows for up to 125% of the current device or user count.
  - The schema must be in JSON format.
  - Column names may contain only letters, digits and underscores.
  - Column names must not match SQL reserved words.
  - Supported data types are int, double, datetime, guid, boolean and string.
  - String columns must have a length value greater than 0.
  - Device key column type must be SystemName or Serial.
  - Users are mapped by email as the unique identifier.
