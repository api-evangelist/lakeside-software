aid: lakeside-software
name: Lakeside Software
description: >-
  Lakeside Software builds SysTrack, a digital employee experience (DEX) platform that instruments
  Windows, macOS, Linux, Android and virtual endpoints with a local agent to collect high-frequency
  telemetry on device health, application performance, resource contention and end-user sentiment.
  SysTrack is delivered as a SaaS cloud tenant and as an on-premises deployment, and exposes
  programmatic access through the SysTrack API (groups, systems, sensors, automations and an audit
  trail), a legacy Data API, and an Ingest API for importing external user and device attributes from
  CSV. The platform ships webhook notifications for sensor, anomaly and data-egress events with
  HMAC-SHA256 signed-secret verification, a Power BI connector, and SysTrack AI — which exposes a DEX
  Analytics MCP Server alongside A2A, Microsoft Teams and voice channels for agentic and
  natural-language access to endpoint analytics. Lakeside Software is a portfolio company of Insight
  Partners.
