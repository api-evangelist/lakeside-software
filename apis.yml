apis:
- aid: lakeside-software:systrack-api
  name: SysTrack API
  description: >-
    The SysTrack API provides programmatic REST access to SysTrack data on a cloud tenant or
    on-premises installation — enumerating groups, listing the systems within a group, retrieving
    sensor data for a system, running and monitoring SysTrack automations, and reading the audit
    trail through the Audit API. Authentication on cloud tenants uses a SysTrack API key; the
    reference documentation is published behind customer sign-in. The older Data API is now
    considered legacy and Lakeside directs integrators to the SysTrack API.
  humanURL: https://documentation.lakesidesoftware.com/apidocs
  baseURL: https://cloud.lakesidesoftware.com/api/
  tags:
  - Endpoint Monitoring
  - Sensors
  - Automation
  - Audit
  properties:
  - type: Documentation
    url: https://documentation.lakesidesoftware.com/docs/systrack-api-1
  - type: APIReference
    url: https://documentation.lakesidesoftware.com/apidocs
- aid: lakeside-software:systrack-ingest-api
  name: SysTrack Ingest API
  description: >-
    The Ingest API lets SysTrack cloud customers import external user and device attributes from CSV
    files — department, asset tag, purchase date, employee ID and other business-owned fields — and
    surface them through the RPT_EnrichedDevices and RPT_EnrichedUsers report views. The feature is
    API-only with no dedicated UI, and uses a staged workflow: define a JSON schema, upload the CSV,
    review the reported differences, then explicitly call the process endpoint to start ingestion.
  humanURL: https://documentation.lakesidesoftware.com/docs/ingest-api-user-guide
  baseURL: https://cloud.lakesidesoftware.com/api/
  tags:
  - Data Ingest
  - Enrichment
  - CSV
  properties:
  - type: Documentation
    url: https://documentation.lakesidesoftware.com/docs/ingest-api-user-guide
