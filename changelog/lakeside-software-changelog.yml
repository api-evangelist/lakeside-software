- version: '11.8 (agent)'
  date: '2026-06'
  url: https://documentation.lakesidesoftware.com/docs/11-8-agent-release-notes
  breaking: false
  highlights:
  - >-
    Reliability Engineering — a proactive persona-based workflow to investigate, act and track
    issues, reachable from the Landing Page or Navigation Menu after an administrator enables access.
  - >-
    Experience Index (previously Health Score v2) — a sensor-driven measure of user experience;
    requires agent 11.8 and rolls out gradually to customers with 50%+ of endpoints upgraded.
  - >-
    SysTrack AI can now initiate approved Self-Help automations directly from end-user channels
    including Microsoft Teams, Voice, MCP, A2A and API; only automations approved in the Self-Help
    catalog are eligible and execution is logged for auditing.
  - SecureBoot status collection for Windows, macOS and Linux, stored in SASCFG.
  changes:
  - Generic GPU utilization collection extended to overall and per-application compute utilization on Windows, and overall GPU memory utilization on macOS, for both integrated and dedicated GPUs.
  - Battery cycle count now collected on Android devices; Windows battery inventory now sourced from the Windows Battery Report, adding cycle count, capacity and chemistry.
  notes:
  - >-
    Previously announced agent default changes for 11.8 were withdrawn — collection defaults for user
    information and web collection remain unchanged, and no action is required.
  - Support for version 10.12 agents ended April 12, 2026; support for 11.0 agents ends July 26, 2026.
